#   name:        Full name as it appears on the card. Required.
#   role:        Role on the IDEAS project. Required.
#   institution: Institution the member is based at. Required.
#   photo:       Optional. Filename of a photo under assets/img/team/.
#   links:       Optional. Any of homepage, orcid, scholar, github (full URLs).
#                Only the link types present are rendered.
